<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zero Errors, Every Article — Proof Central Output XML Validation Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F3EFE4; --paper-raised:#FBF9F3; --ink:#26201A; --muted:#6E6657;
  --rule:#D9D2C0; --rule-strong:#B9B09A;
  --rust:#A6402B; --rust-soft:#E7D2CB;
  --sage:#4B6358; --sage-soft:#D8E1DB;
  --amber:#B8862E; --amber-soft:#EFDFBB;
  --slate:#5B6672; --slate-soft:#DDE2E6;
  --font-display:'Source Serif 4', Georgia, serif;
  --font-body:'Inter', -apple-system, sans-serif;
  --font-mono:'IBM Plex Mono', 'Courier New', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;line-height:1.45;}
#app{max-width:920px;margin:0 auto;padding:28px 20px 90px;}

.masthead{border-bottom:3px double var(--ink);padding-bottom:16px;margin-bottom:26px;}
.masthead-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.btn{font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;background:var(--ink);color:var(--paper-raised);border:none;padding:9px 16px;cursor:pointer;border-radius:1px;}
.btn:hover{background:var(--rust);}
.title{font-family:var(--font-display);font-weight:700;font-size:36px;letter-spacing:-0.01em;margin:10px 0 4px;}
.subtitle{font-family:var(--font-display);font-style:italic;color:var(--muted);font-size:15px;margin:0 0 12px;}
.masthead-meta{font-size:12.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;}
.masthead-meta b{color:var(--ink);font-family:var(--font-mono);font-weight:600;}
.run-select-row{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;}
.run-select-row select{font-family:var(--font-mono);font-size:12px;background:var(--paper-raised);border:1px solid var(--rule-strong);padding:5px 8px;color:var(--ink);}

.empty-state{text-align:center;padding:70px 20px;color:var(--muted);font-family:var(--font-display);font-size:18px;border:1px dashed var(--rule-strong);border-radius:2px;}
.empty-state .hint{font-family:var(--font-body);font-size:13px;margin-top:10px;color:var(--muted);}

.northstar{border:2px solid var(--ink);padding:28px 30px;margin-bottom:28px;background:var(--paper-raised);}
.ns-kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust);margin-bottom:8px;}
.ns-hero-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.ns-hero-num{font-family:var(--font-display);font-weight:700;font-size:72px;line-height:1;color:var(--rust);}
.ns-hero-num.good{color:var(--sage);}
.ns-hero-side{font-family:var(--font-mono);font-size:13px;color:var(--muted);line-height:1.6;}
.ns-hero-target{color:var(--ink);}
.ns-sparkline{width:140px;height:44px;margin-left:auto;}
.ns-split{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule);display:flex;gap:34px;flex-wrap:wrap;}
.ns-split-row{font-size:14px;}
.ns-split-row b{font-family:var(--font-mono);font-weight:600;}
.ns-split-names{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;max-width:280px;}
.ns-user-line{margin-top:12px;font-size:12px;color:var(--muted);}
.ns-copy-link{display:inline-block;margin-top:16px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule-strong);}
.ns-copy-link:hover{color:var(--ink);border-bottom-color:var(--ink);}
.tag-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}

.section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule);}

#askSection{margin-bottom:28px;}
.ask-bar{display:flex;gap:0;border:1px solid var(--rule-strong);}
#askInput{flex:1;border:none;background:var(--paper-raised);padding:13px 16px;font-family:var(--font-body);font-size:14px;color:var(--ink);}
#askInput:focus{outline:none;background:#fff;}
#askInput::placeholder{color:var(--muted);}
.btn-ask{font-family:var(--font-mono);font-size:12px;letter-spacing:.03em;background:var(--ink);color:var(--paper-raised);border:none;padding:0 22px;cursor:pointer;}
.btn-ask:hover{background:var(--rust);}
.btn-ask:disabled{background:var(--rule-strong);cursor:default;}
.ask-answer{margin-top:0;padding:16px 18px;background:var(--paper-raised);border:1px solid var(--rule-strong);border-top:none;font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
.ask-answer.loading{color:var(--muted);font-style:italic;}
.ask-answer.error{color:var(--rust);background:var(--rust-soft);border-color:var(--rust);}
.ask-answer.soon{color:var(--muted);background:var(--paper-raised);border-color:var(--rule-strong);font-style:italic;}
.ask-answer .mono{font-family:var(--font-mono);background:var(--paper);padding:1px 5px;}

.callout{background:var(--rust-soft);border-left:3px solid var(--rust);padding:14px 16px;margin-bottom:20px;font-size:13.5px;}
.callout.sage{background:var(--sage-soft);border-left-color:var(--sage);}
.callout.amber{background:var(--amber-soft);border-left-color:var(--amber);}

.priority-list{margin-bottom:30px;}
.priority-row{border:1px solid var(--rule);border-left:4px solid var(--rust);margin-bottom:10px;background:var(--paper-raised);}
.priority-row.parser{border-left-color:var(--slate);}
.priority-row summary{text-transform:none;font-family:var(--font-body);padding:14px 16px;color:var(--ink);}
.priority-row summary::after{content:'+';font-size:18px;color:var(--rule-strong);align-self:flex-start;margin-left:10px;}
.priority-row[open] summary::after{content:'–';}
.priority-row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;flex:1;}
.priority-row h3{font-family:var(--font-display);font-size:17px;margin:0 0 3px;}
.stage-badge{display:inline-block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid;padding:1px 6px;border-radius:2px;vertical-align:middle;margin-left:6px;}
.priority-row .metrics{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

.priority-detail{padding:0 16px 16px;border-top:1px solid var(--rule);margin-top:2px;}
.detail-block{padding-top:14px;}
.detail-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--rust);margin-bottom:5px;}
.detail-block p{font-size:13px;margin:0;color:var(--ink);line-height:1.5;}
.detail-block p+p{margin-top:6px;}
.variant-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:4px 0;border-bottom:1px solid var(--rule);}
.variant-row:last-child{border-bottom:none;}
.variant-row .mono{font-family:var(--font-mono);color:var(--ink);word-break:break-word;}
.variant-count{font-family:var(--font-mono);color:var(--muted);white-space:nowrap;}
.sample-pill{display:inline-block;font-family:var(--font-mono);font-size:11px;background:var(--paper);border:1px solid var(--rule-strong);padding:3px 8px;margin:2px 4px 2px 0;border-radius:1px;}

.trend-badge{font-family:var(--font-mono);font-size:10.5px;padding:2px 7px;border-radius:2px;white-space:nowrap;}
.trend-badge.down{background:var(--sage-soft);color:var(--sage);}
.trend-badge.up{background:var(--rust-soft);color:var(--rust);}
.trend-badge.flat{background:var(--slate-soft);color:var(--slate);}
.trend-badge.new{background:var(--amber-soft);color:var(--amber);}

details{border:1px solid var(--rule);margin-bottom:12px;background:var(--paper-raised);}
details summary{cursor:pointer;padding:12px 16px;font-family:var(--font-mono);font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;justify-content:space-between;align-items:center;}
details summary::-webkit-details-marker{display:none;}
details summary::after{content:'+';font-size:16px;color:var(--rule-strong);}
details[open] summary::after{content:'–';}
details summary:hover{color:var(--ink);}
details .details-body{padding:6px 16px 16px;}

table.data{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data th{text-align:left;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--ink);padding:6px 8px;}
table.data td{padding:6px 8px;border-bottom:1px solid var(--rule);}
table.data tr:hover td{background:var(--paper);}
table.data td.mono,table.data th.mono{font-family:var(--font-mono);}
table.data td.num{text-align:right;font-family:var(--font-mono);}
table.data th.num{text-align:right;}

.chart-wrap{border:1px solid var(--rule);padding:16px;margin-bottom:20px;background:var(--paper-raised);}
.chart-wrap canvas{max-height:240px;}

.footnote{font-size:11px;color:var(--muted);margin-top:6px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper-raised);font-family:var(--font-mono);font-size:12.5px;padding:10px 18px;border-radius:2px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:50;}

@media(max-width:640px){.title{font-size:28px;} .ns-hero-num{font-size:48px;} .ns-sparkline{display:none;}}
</style>
</head>
<body>
<div id="app">
  <header class="masthead">
    <div class="masthead-top">
      <div class="kicker">Proof Central Output XML Validation Report</div>
      <div>
        <button class="btn" id="uploadBtn">+ Upload CSV run</button>
        <input type="file" id="fileInput" accept=".csv" hidden />
      </div>
    </div>
    <h1 class="title">Zero Errors, Every Article</h1>
    <div class="run-select-row" id="runSelectRow" style="display:none;">
      <label style="color:var(--muted);">Viewing —</label>
      <select id="runSelect"></select>
    </div>
  </header>

  <div id="emptyState" class="empty-state">
    Upload your first error CSV to generate the tracker.
    <div class="hint">Expected columns: <code>error</code>, <code>jid</code>, <code>aid</code>, <code>start_time</code>. Shared with everyone who opens this app.</div>
  </div>

  <main id="main" hidden>
    <section id="northstarSection"></section>
    <section id="askSection"></section>
    <section id="prioritySection"></section>
    <section id="deepDiveSection"></section>
  </main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
function normalizeTemplate(msg){
  let m=String(msg);
  m=m.replace(/systemId: file:[^\s;]+/g,'systemId: file:<FILE>');
  m=m.replace(/lineNumber: \d+/g,'lineNumber: <N>');
  m=m.replace(/columnNumber: \d+/g,'columnNumber: <N>');
  m=m.replace(/"[^"]*"/g,'"<X>"');
  m=m.replace(/row [\d, ]+/g,'row <LIST> ');
  m=m.replace(/\d+/g,'<N>');
  return m.trim();
}
// Categorized the way an XML processor actually evaluates a document, in order:
// 1. Well-formedness / namespace constraints — checked first, before any grammar is consulted.
// 2. Validity — checked against the DTD/schema (element content models, ID/IDREF, entity declarations, attribute lists).
// 3. Business rule — checks no DTD/XSD can express (co-occurrence, formatting, patterns) — typically Schematron-style rules layered on top.
function categorize(template){
  const t=template.toLowerCase();
  if(t.includes('prefixed namespace bindings'))return 'Namespace binding';
  if(t.includes('xmlns')&&t.includes('must be declared'))return 'Namespace attribute declaration';
  if(t.includes('entity')&&t.includes('unparsed'))return 'Unparsed entity';
  if(t.includes('begins or ends with a space')||t.includes('whitespace'))return 'Whitespace formatting';
  if(t.includes('bibliograph')||t.includes('overlap'))return 'Bibliography / references';
  if(t.includes('not all entries')||t.includes('row'))return 'Table structure';
  if(t.includes('doi'))return 'DOI formatting';
  if(t.includes('id must be unique')||t.includes('identifier'))return 'Identifier / ID conflict';
  if(t.includes('author')||t.includes('affiliation')||t.includes('given-name')||t.includes('surname'))return 'Author / affiliation metadata';
  if(t.includes('content of element type')||t.includes('must match'))return 'Element structure / schema mismatch';
  return 'Other';
}
// The XML-processing stage each category belongs to — factual, not a judgment call.
// Distinct from the Product/Parser/User origin tag below: stage says WHERE in XML
// processing the failure happens, origin says WHO should fix it. A stage can inform
// origin (well-formedness/validity issues are almost always systemic) but isn't the same axis.
const XML_STAGES = {
  'Namespace binding': 'wellformedness',              // Namespaces-in-XML constraint: prefixed bindings must not be empty
  'Namespace attribute declaration': 'validity',       // DTD requires an ATTLIST declaration for this attribute
  'Unparsed entity': 'validity',                       // VC: Entity Name — ENTITY-typed attribute must name a declared unparsed entity
  'Element structure / schema mismatch': 'validity',   // VC: Element Valid — content doesn't match the declared content model
  'Identifier / ID conflict': 'validity',              // VC: ID / IDREF — uniqueness and reference-resolution constraints
  'Whitespace formatting': 'businessrule',
  'Bibliography / references': 'businessrule',
  'Table structure': 'businessrule',
  'DOI formatting': 'businessrule',
  'Author / affiliation metadata': 'businessrule',
  'Other': 'unclassified'
};
const STAGE_META = {
  wellformedness: { label:'Well-formedness', short:'Well-formed', color:'var(--rust)',
    def:'The most basic check there is — is this even valid XML at all? This is checked first, before anything is compared against a template. If it fails here, nothing else about the document matters yet.' },
  validity: { label:'Validity (DTD/Schema)', short:'Validity', color:'var(--amber)',
    def:'The document is technically valid XML, but doesn\'t match the structure the DTD/schema requires — a missing declaration, a mismatched section, or a broken cross-reference.' },
  businessrule: { label:'Business rule', short:'Business rule', color:'var(--slate)',
    def:'Passes basic XML checks, but breaks a content rule layered on top — formatting, completeness, or a pattern check. These often trace back to the source content itself.' },
  unclassified: { label:'Unclassified', short:'Unclassified', color:'var(--muted)', def:'Doesn\'t cleanly fit the categories above — worth a manual look.' }
};
function aggregate(rows){
  const categories={},buckets={},daily={},journals={},articles={};
  let totalInstances=0;
  for(const row of rows){
    const date=String(row.start_time).slice(0,10);
    if(!daily[date])daily[date]={instances:0,articlesWithError:new Set(),runs:0};
    daily[date].runs+=1;
    if(!journals[row.jid])journals[row.jid]={errorCount:0,articles:new Set()};
    journals[row.jid].articles.add(row.aid);
    if(!articles[row.aid])articles[row.aid]={jid:row.jid,runs:0,templates:new Set(),categories:new Set(),firstSeen:date,lastSeen:date};
    const a=articles[row.aid];
    a.runs+=1;
    if(date<a.firstSeen)a.firstSeen=date;
    if(date>a.lastSeen)a.lastSeen=date;
    daily[date].articlesWithError.add(row.aid);
    for(const msg of row.error){
      totalInstances+=1;
      const template=normalizeTemplate(msg);
      const catLabel=categorize(msg);
      if(!categories[template])categories[template]={template,category:catLabel,count:0,articles:new Set(),journals:new Set(),sample:msg};
      const c=categories[template];
      c.count+=1;c.articles.add(row.aid);c.journals.add(row.jid);
      if(!buckets[catLabel])buckets[catLabel]={category:catLabel,count:0,articles:new Set(),journals:new Set(),sampleArticles:[]};
      const b=buckets[catLabel];
      b.count+=1;b.articles.add(row.aid);b.journals.add(row.jid);
      if(b.sampleArticles.length<6 && !b.sampleArticles.some(s=>s.aid===row.aid)) b.sampleArticles.push({aid:row.aid,jid:row.jid});
      daily[date].instances+=1;
      journals[row.jid].errorCount+=1;
      a.templates.add(template);
      a.categories.add(catLabel);
    }
  }
  return {categories,buckets,daily,journals,articles,totalInstances};
}
const EXPLANATIONS={
  'Namespace binding':'An attribute like xmlns:xlink has an empty or malformed value where the XML Namespaces spec requires a real, non-empty binding. This is a namespace well-formedness constraint — checked before any DTD/schema is even consulted. A portion of these instances surface as a raw parser exception (org.xml.sax.SAXParseException) rather than a clean validator message — same root cause, different surface.',
  'Namespace attribute declaration':'The DTD requires every attribute used in the document — including xmlns:mml, xmlns:tb, etc. — to have a matching ATTLIST declaration. That declaration is missing from the DTD/template, so the parser can\'t validate the attribute even though its value is fine.',
  'Unparsed entity':'The document references an external file (a figure, scheme, or graphical-abstract image — e.g. "gr1", "sc1", "fx1") that has to be declared in the DOCTYPE as an unparsed (NDATA) entity before validation. That declaration is missing, so the parser can\'t confirm the reference resolves to a real file.',
  'Whitespace formatting':'An element\'s content starts or ends with a space/tab/linebreak where the schema requires trimmed content.',
  'Bibliography / references':'A reference list entry exists that no in-text citation points to (or two entries overlap), which the schema requires to be fully linked.',
  'Table structure':'A table row has more or fewer cell entries than the table\'s column count declares.',
  'Author / affiliation metadata':'An author name, initials, or affiliation field doesn\'t match the expected format (e.g. stray whitespace inside initials).',
  'DOI formatting':'A DOI value doesn\'t match the expected DOI pattern.',
  'Identifier / ID conflict':'An element ID is duplicated within the document, or something references an ID that doesn\'t exist.',
  'Element structure / schema mismatch':'An element\'s content doesn\'t match the content model the schema expects for that element type.',
  'Other':'A lower-volume validation error that doesn\'t fit the categories above — see the raw message pattern for specifics.'
};
const RECOMMENDATIONS={
  'Namespace binding':'Check whatever assembles the namespace declarations on the root element — the binding is coming through empty rather than pointing at a real namespace URI. Almost certainly one shared template/DTD issue, not per-article.',
  'Namespace attribute declaration':'Check the shared DTD — it\'s missing ATTLIST declarations for the namespace-prefixed attributes the content actually uses.',
  'Unparsed entity':'Check the pipeline step that generates NDATA entity declarations for each article\'s graphics (figures/schemes/graphical abstract). It\'s either not running before validation, or not being merged into the DOCTYPE internal subset.',
  'Whitespace formatting':'An automated trim/normalize pass in the authoring or conversion tool would catch this before validation.',
  'Bibliography / references':'Points to citation-linking logic in the conversion tool.',
  'Table structure':'Usually traces back to how source tables are converted to XML — check the table-conversion step for the affected journal(s).',
  'Author / affiliation metadata':'Likely upstream metadata-extraction — check the author-parsing step.',
  'DOI formatting':'Check the DOI generation or lookup step feeding the record.',
  'Identifier / ID conflict':'Check ID-generation logic in the conversion tool.',
  'Element structure / schema mismatch':'Needs case-by-case review — pull a sample article and compare against the schema\'s content model for that element.',
  'Other':'Worth a manual pass once the categories above are addressed.'
};
function buildSummary(agg,meta){
  const categories=Object.values(agg.categories).map(c=>({template:c.template,category:c.category,count:c.count,articleCount:c.articles.size,journalCount:c.journals.size,sample:c.sample})).sort((a,b)=>b.count-a.count);
  const totalInstances=agg.totalInstances;
  const totalJournals=Object.keys(agg.journals).length;
  const totalArticlesWithAnyError=Object.keys(agg.articles).length;

  // "If this category is fixed" — for each article that has this category, does it have
  // ONLY this category (would become fully clean) or other categories too (still affected)?
  const wouldBecomeClean={}, stillAffected={};
  Object.values(agg.articles).forEach(a=>{
    a.categories.forEach(cat=>{
      if(a.categories.size===1){ wouldBecomeClean[cat]=(wouldBecomeClean[cat]||0)+1; }
      else{ stillAffected[cat]=(stillAffected[cat]||0)+1; }
    });
  });

  const buckets=Object.values(agg.buckets).map(b=>{
    const articleCount=b.articles.size,journalCount=b.journals.size;
    const shareOfTotal=totalInstances?b.count/totalInstances:0;
    const journalBreadth=totalJournals?journalCount/totalJournals:0;
    const stage=XML_STAGES[b.category]||'unclassified';
    return {category:b.category,count:b.count,articleCount,journalCount,journalBreadth,shareOfTotal,stage,
      explanation:EXPLANATIONS[b.category]||EXPLANATIONS['Other'],
      recommendation:RECOMMENDATIONS[b.category]||RECOMMENDATIONS['Other'],
      sampleArticles:b.sampleArticles,
      wouldBecomeClean:wouldBecomeClean[b.category]||0,
      stillAffected:stillAffected[b.category]||0};
  });
  const maxCount=Math.max(1,...buckets.map(b=>b.count));
  const maxArticles=Math.max(1,...buckets.map(b=>b.articleCount));
  const maxJournals=Math.max(1,...buckets.map(b=>b.journalCount));
  buckets.forEach(b=>{b.impactScore=0.5*(b.count/maxCount)+0.3*(b.articleCount/maxArticles)+0.2*(b.journalCount/maxJournals);});
  buckets.sort((a,b)=>b.impactScore-a.impactScore);
  const daily=Object.keys(agg.daily).sort().map(date=>({date,instances:agg.daily[date].instances,articlesWithError:agg.daily[date].articlesWithError.size,runs:agg.daily[date].runs}));
  const journals=Object.entries(agg.journals).map(([jid,j])=>({jid,errorCount:j.errorCount,articleCount:j.articles.size,errorsPerArticle:j.articles.size?j.errorCount/j.articles.size:0})).sort((a,b)=>b.errorCount-a.errorCount).slice(0,40);
  const stuckArticles=Object.entries(agg.articles).map(([aid,a])=>({aid,jid:a.jid,runs:a.runs,distinctErrorTypes:a.templates.size,firstSeen:a.firstSeen,lastSeen:a.lastSeen})).sort((a,b)=>b.runs-a.runs).slice(0,40);
  const messiest=Object.entries(agg.articles).map(([aid,a])=>({aid,jid:a.jid,runs:a.runs,distinctErrorTypes:a.templates.size,firstSeen:a.firstSeen,lastSeen:a.lastSeen})).sort((a,b)=>b.distinctErrorTypes-a.distinctErrorTypes).slice(0,40);
  return {
    meta,
    totals:{totalInstances,totalRuns:meta.rowCount,uniqueArticles:Object.keys(agg.articles).length,uniqueJournals:totalJournals,avgErrorsPerRun:meta.rowCount?totalInstances/meta.rowCount:0,dateStart:daily.length?daily[0].date:null,dateEnd:daily.length?daily[daily.length-1].date:null},
    buckets,categories,daily,journals,stuckArticles,messiest
  };
}

// Which stages count toward "must eliminate" vs which are tracked separately.
// This is deterministic — it follows from what stage of XML processing produced the
// error, not a judgment call about who's at fault. Well-formedness and Validity errors
// can only be caused by the system that builds the XML; a reader or author's content
// can't trigger them. Business-rule errors are the ones that can trace back to content.
const STAGE_COUNTS_AGAINST_GOAL = { wellformedness:true, validity:true, businessrule:false, unclassified:false };

let currentSummary=null, currentRunId=null, runsIndex=[];
let trendChart=null;

function fmtInt(n){return Number(n||0).toLocaleString('en-US');}
function fmtPct(n){return (n*100).toFixed(1)+'%';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showToast(msg,ms){ms=ms||3200;const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(showToast._h);showToast._h=setTimeout(function(){t.hidden=true;},ms);}

async function loadIndex(){try{const res=await fetch('/api/runs');runsIndex=res.ok?await res.json():[];}catch(e){runsIndex=[];}}
async function saveRun(summary){
  const res=await fetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(summary)});
  if(!res.ok)throw new Error('Server rejected the upload ('+res.status+')');
  return (await res.json()).id;
}
async function loadRun(id){const res=await fetch('/api/runs/'+encodeURIComponent(id));return res.ok?await res.json():null;}

document.getElementById('uploadBtn').addEventListener('click',function(){document.getElementById('fileInput').click();});
document.getElementById('fileInput').addEventListener('change', async function(e){
  const file=e.target.files[0];
  if(!file)return;
  showToast('Reading '+file.name+' …',60000);
  try{
    const text=await file.text();
    const parsed=Papa.parse(text,{header:true,skipEmptyLines:true});
    if(!parsed.data.length){showToast('No rows found in that file.');return;}
    const rows=[];
    for(const r of parsed.data){
      if(!r.jid||!r.aid||!r.start_time||!r.error)continue;
      let errArr;
      try{errArr=JSON.parse(r.error); if(!Array.isArray(errArr))errArr=[String(r.error)];}
      catch(e){errArr=[String(r.error)];}
      rows.push({error:errArr,jid:r.jid,aid:r.aid,start_time:r.start_time});
    }
    if(!rows.length){showToast('Could not find error/jid/aid/start_time columns in that file.');return;}
    const agg=aggregate(rows);
    const meta={filename:file.name,uploadedAt:new Date().toISOString(),rowCount:rows.length};
    const summary=buildSummary(agg,meta);
    const id=await saveRun(summary);
    await loadIndex();
    currentSummary=summary;
    currentRunId=id;
    populateRunSelect(id);
    renderAll(summary);
    showToast('Uploaded '+file.name+' — visible to your whole team now.');
  }catch(err){
    console.error(err);
    showToast('Could not process that file: '+err.message);
  }finally{ e.target.value=''; }
});

function populateRunSelect(selectId){
  const row=document.getElementById('runSelectRow'), sel=document.getElementById('runSelect');
  if(!runsIndex.length){row.style.display='none';return;}
  row.style.display=runsIndex.length>1?'flex':'none';
  sel.innerHTML=runsIndex.map(function(r){return '<option value="'+r.id+'">'+esc(r.filename)+' — '+new Date(r.uploadedAt).toLocaleString()+' ('+fmtInt(r.totalInstances)+' errors)</option>';}).join('');
  sel.value=selectId;
}
document.getElementById('runSelect').addEventListener('change', async function(e){
  const summary=await loadRun(e.target.value);
  if(summary){currentSummary=summary;currentRunId=e.target.value;renderAll(summary);showToast('Loaded '+summary.meta.filename);}
});

function computeNorthStar(summary){
  const breakdown = { wellformedness:{count:0,categories:[]}, validity:{count:0,categories:[]}, businessrule:{count:0,categories:[]}, unclassified:{count:0,categories:[]} };
  summary.buckets.forEach(function(b){
    const stage=b.stage;
    breakdown[stage].count += b.count;
    breakdown[stage].categories.push({ category:b.category, count:b.count, articleCount:b.articleCount, journalCount:b.journalCount });
  });
  Object.keys(breakdown).forEach(function(k){ breakdown[k].categories.sort(function(a,b){return b.count-a.count;}); });
  const mustFixCount = breakdown.wellformedness.count + breakdown.validity.count;
  const contentCount = breakdown.businessrule.count + breakdown.unclassified.count;
  const total = mustFixCount + contentCount;
  const share = total ? mustFixCount/total : 0;
  return { mustFixCount, contentCount, total, share, breakdown };
}

function buildStakeholderSummary(summary){
  const ns=computeNorthStar(summary);
  const lines=[];
  lines.push('Proof Central — Output XML Validation Report — '+summary.meta.filename+' ('+summary.totals.dateStart+' to '+summary.totals.dateEnd+')');
  lines.push('');
  lines.push('Must eliminate: '+fmtInt(ns.mustFixCount)+' errors ('+fmtPct(ns.share)+' of '+fmtInt(summary.totals.totalInstances)+' total). Target: zero.');
  lines.push('These can only come from how the document is built — not from a reader or author\'s content.');
  lines.push('');
  lines.push('WELL-FORMEDNESS (broken before any rules are even checked): '+fmtInt(ns.breakdown.wellformedness.count));
  ns.breakdown.wellformedness.categories.forEach(function(c){ lines.push('  - '+c.category+': '+fmtInt(c.count)+' ('+fmtInt(c.articleCount)+' articles, '+fmtInt(c.journalCount)+' journals)'); });
  lines.push('');
  lines.push('VALIDITY / DTD-SCHEMA (breaks the required structure): '+fmtInt(ns.breakdown.validity.count));
  ns.breakdown.validity.categories.forEach(function(c){ lines.push('  - '+c.category+': '+fmtInt(c.count)+' ('+fmtInt(c.articleCount)+' articles, '+fmtInt(c.journalCount)+' journals)'); });
  lines.push('');
  lines.push('CONTENT-RELATED / BUSINESS RULE (tracked separately, not counted above): '+fmtInt(ns.breakdown.businessrule.count+ns.breakdown.unclassified.count));
  ns.breakdown.businessrule.categories.forEach(function(c){ lines.push('  - '+c.category+': '+fmtInt(c.count)); });
  return lines.join('\n');
}

function renderNorthStar(summary){
  const ns=computeNorthStar(summary);
  const el=document.getElementById('northstarSection');
  const goodClass = ns.mustFixCount === 0 ? 'good' : '';

  function splitRow(stageKey){
    const meta=STAGE_META[stageKey];
    const b = ns.breakdown[stageKey];
    const names = b.categories.map(function(c){return c.category;}).join(', ');
    return '<div class="ns-split-row"><span class="tag-dot" style="background:'+meta.color+'"></span>'+
      '<b>'+meta.label+': '+fmtInt(b.count)+'</b>'+
      '<span class="ns-split-names">'+(names?esc(names):'none')+'</span></div>';
  }

  const contentTotal=ns.breakdown.businessrule.count+ns.breakdown.unclassified.count;

  el.innerHTML=
    '<div class="northstar">'+
      '<div class="ns-kicker">Errors we must eliminate</div>'+
      '<div class="ns-hero-row">'+
        '<div class="ns-hero-num '+goodClass+'">'+fmtInt(ns.mustFixCount)+'</div>'+
        '<div class="ns-hero-side">'+
          '<div>'+fmtPct(ns.share)+' of '+fmtInt(summary.totals.totalInstances)+' errors</div>'+
          '<div class="ns-hero-target">so every article passes clean</div>'+
        '</div>'+
        '<canvas id="nsSparkline" class="ns-sparkline"></canvas>'+
      '</div>'+
      '<p class="ns-why">A fix here doesn\'t just clear one article — it clears every future one that would\'ve hit the same error.</p>'+
      '<div class="ns-split">'+
        splitRow('wellformedness')+
        splitRow('validity')+
      '</div>'+
      '<div class="ns-user-line">'+fmtInt(contentTotal)+' more errors are content-related (business rule) — tracked separately, not counted here.</div>'+
      '<a href="#" class="ns-copy-link" id="copySummaryBtn">Copy summary for stakeholders →</a>'+
    '</div>';

  document.getElementById('copySummaryBtn').addEventListener('click', async function(e){
    e.preventDefault();
    const text = buildStakeholderSummary(summary);
    try{
      await navigator.clipboard.writeText(text);
      showToast('Copied — paste into an email or Slack update.');
    }catch(e){
      showToast('Could not copy automatically — see the browser console.');
      console.log(text);
    }
  });

  renderNsSparkline();
}

// Builds the payload sent with every question — everything currently on the page,
// so a question can be answered from data already computed, without a new upload.
function buildAskContext(summary){
  const ns=computeNorthStar(summary);
  return {
    totals: summary.totals,
    mustEliminate: { count: ns.mustFixCount, share: ns.share,
      wellformedness: ns.breakdown.wellformedness,
      validity: ns.breakdown.validity,
      contentRelated: { count: ns.breakdown.businessrule.count+ns.breakdown.unclassified.count, categories: ns.breakdown.businessrule.categories.concat(ns.breakdown.unclassified.categories) } },
    categoriesDetailed: summary.buckets.map(function(b){
      return {category:b.category, stage:b.stage, count:b.count, shareOfTotal:b.shareOfTotal,
        articleCount:b.articleCount, journalCount:b.journalCount,
        wouldBecomeClean:b.wouldBecomeClean, stillAffected:b.stillAffected};
    }),
    rawMessagePatterns: summary.categories,
    dailyTrend: summary.daily,
    topJournalsByErrorCount: summary.journals,
    stuckArticles: summary.stuckArticles,
    messiestArticles: summary.messiest,
    uploadHistory: runsIndex.map(function(r){return {filename:r.filename, uploadedAt:r.uploadedAt, totalInstances:r.totalInstances, uniqueArticles:r.uniqueArticles, categoryBreakdown:r.categoryBreakdown};}),
    currentFilename: summary.meta.filename
  };
}

function renderAsk(summary){
  const el=document.getElementById('askSection');
  el.innerHTML=
    '<div class="ask-bar">'+
      '<input type="text" id="askInput" placeholder="Ask anything about this data — e.g. \'which journal improved the most last week?\'" />'+
      '<button id="askBtn" class="btn-ask">Ask</button>'+
    '</div>'+
    '<div id="askAnswer" class="ask-answer" hidden></div>';

  const input=document.getElementById('askInput');
  const btn=document.getElementById('askBtn');
  const answerEl=document.getElementById('askAnswer');

  async function submitQuestion(){
    const question=input.value.trim();
    if(!question) return;
    btn.disabled=true; btn.textContent='Asking…';
    answerEl.hidden=false;
    answerEl.className='ask-answer loading';
    answerEl.textContent='Thinking…';
    try{
      const res=await fetch('/api/ask',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question:question, context:buildAskContext(summary)})
      });
      const data=await res.json();
      if(!res.ok){
        answerEl.className='ask-answer error';
        if(data.error==='not_configured'){
          answerEl.className='ask-answer soon';
          answerEl.innerHTML='This feature is coming soon.';
        }else{
          answerEl.textContent='Could not get an answer right now — please try again in a moment.';
        }
      }else{
        answerEl.className='ask-answer';
        answerEl.textContent=data.answer;
      }
    }catch(e){
      answerEl.className='ask-answer error';
      answerEl.textContent='Could not reach the server — please try again in a moment.';
    }finally{
      btn.disabled=false; btn.textContent='Ask';
    }
  }

  btn.addEventListener('click', submitQuestion);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') submitQuestion(); });
}

function renderPriority(summary){
  const el=document.getElementById('prioritySection');
  const mustFix=summary.buckets.filter(function(b){return STAGE_COUNTS_AGAINST_GOAL[b.stage];}).sort(function(a,b){return b.impactScore-a.impactScore;});
  const contentRelated=summary.buckets.filter(function(b){return !STAGE_COUNTS_AGAINST_GOAL[b.stage];});
  const prevMap=getPreviousCategoryMap();

  el.innerHTML=
    '<div class="section-label">Fix these, in order</div>'+
    (mustFix.length===0?'<div class="callout sage">Nothing to eliminate right now.</div>':'')+
    '<div class="priority-list" id="mustFixList"></div>'+
    '<details>'+
      '<summary>Content-related ('+contentRelated.length+' categories, '+fmtInt(contentRelated.reduce(function(s,b){return s+b.count;},0))+' errors) — not on this list</summary>'+
      '<div class="details-body" id="contentRelatedList"></div>'+
    '</details>';

  document.getElementById('mustFixList').innerHTML = mustFix.map(function(b){return priorityRowHtml(b, summary, prevMap);}).join('');
  document.getElementById('contentRelatedList').innerHTML = contentRelated.length
    ? '<table class="data"><thead><tr><th>Category</th><th>Stage</th><th class="num">Errors</th><th class="num">Articles</th><th class="num">Journals</th></tr></thead><tbody>'+contentRelated.map(userRowHtml).join('')+'</tbody></table>'
    : '<p class="footnote">None.</p>';
}

// Finds the immediately-previous upload's per-category counts, so each row can show
// "this vs last time" instead of leadership having to cross-reference a chart.
function getPreviousCategoryMap(){
  if(!currentRunId || runsIndex.length<2) return null;
  const idx=runsIndex.findIndex(function(r){return r.id===currentRunId;});
  if(idx<0 || idx+1>=runsIndex.length) return null;
  const prev=runsIndex[idx+1];
  const map={};
  (prev.categoryBreakdown||[]).forEach(function(c){ map[c.category]=c; });
  return map;
}

function trendBadgeHtml(b, prevMap){
  if(!prevMap) return '';
  const prev=prevMap[b.category];
  if(!prev) return '<span class="trend-badge new">new</span>';
  if(prev.count===0) return b.count===0 ? '<span class="trend-badge flat">still 0</span>' : '<span class="trend-badge up">regressed</span>';
  const delta=(b.count-prev.count)/prev.count*100;
  if(Math.abs(delta)<1) return '<span class="trend-badge flat">flat</span>';
  const dir=delta<0?'down':'up';
  const arrow=delta<0?'▼':'▲';
  return '<span class="trend-badge '+dir+'">'+arrow+' '+Math.abs(delta).toFixed(0)+'%</span>';
}

function priorityRowHtml(b, summary, prevMap){
  const stage=STAGE_META[b.stage]||STAGE_META.unclassified;
  const variants=summary.categories.filter(function(c){return c.category===b.category;}).sort(function(x,y){return y.count-x.count;});
  const samples=b.sampleArticles||[];

  const variantsHtml = variants.map(function(v){
    return '<div class="variant-row"><span class="mono">'+esc(v.template)+'</span><span class="variant-count">'+fmtInt(v.count)+'</span></div>';
  }).join('');

  const samplesHtml = samples.length
    ? samples.map(function(s){return '<span class="sample-pill">'+esc(s.jid)+' / '+esc(s.aid)+'</span>';}).join(' ')
    : '<span class="footnote">No sample articles captured.</span>';

  // "If this is fixed" — what actually happens to error volume and to affected-article count.
  const newTotalInstances = summary.totals.totalInstances - b.count;
  const errorPctDrop = summary.totals.totalInstances ? b.count/summary.totals.totalInstances : 0;
  const articlePctDrop = summary.totals.uniqueArticles ? b.wouldBecomeClean/summary.totals.uniqueArticles : 0;
  const ifFixedHtml =
    '<p><b class="mono">'+fmtPct(errorPctDrop)+'</b> drop in total error volume — '+fmtInt(summary.totals.totalInstances)+' → '+fmtInt(newTotalInstances)+' instances.</p>'+
    '<p><b class="mono">'+fmtPct(articlePctDrop)+'</b> of currently-failing articles go fully clean — '+fmtInt(b.wouldBecomeClean)+' of '+fmtInt(summary.totals.uniqueArticles)+' affected articles have <u>only</u> this error.</p>'+
    (b.stillAffected>0 ? '<p class="footnote">'+fmtInt(b.stillAffected)+' more articles have this error plus others — they\'d still show up on the list, just with less on them.</p>' : '');

  return '<details class="priority-row" data-category="'+esc(b.category)+'" style="border-left-color:'+stage.color+'">'+
    '<summary>'+
      '<div class="priority-row-top">'+
        '<div>'+
          '<h3>'+esc(b.category)+' <span class="stage-badge" style="color:'+stage.color+';border-color:'+stage.color+'">'+stage.short+'</span></h3>'+
          '<div class="metrics">'+fmtInt(b.count)+' · '+fmtPct(b.shareOfTotal)+' of all errors · '+fmtInt(b.articleCount)+' articles · '+fmtInt(b.journalCount)+' journals '+trendBadgeHtml(b,prevMap)+'</div>'+
        '</div>'+
      '</div>'+
    '</summary>'+
    '<div class="priority-detail">'+
      '<div class="detail-block"><div class="detail-label">'+stage.label+'</div><p>'+esc(stage.def)+'</p></div>'+
      '<div class="detail-block"><div class="detail-label">What it is</div><p>'+esc(b.explanation)+'</p></div>'+
      '<div class="detail-block"><div class="detail-label">What to fix</div><p>'+esc(b.recommendation)+'</p></div>'+
      '<div class="detail-block"><div class="detail-label">If this is fixed</div>'+ifFixedHtml+'</div>'+
      '<div class="detail-block"><div class="detail-label">Sample articles (journal / article ID)</div><p>'+samplesHtml+'</p></div>'+
      '<div class="detail-block"><div class="detail-label">Message variants under this category</div>'+variantsHtml+'</div>'+
    '</div>'+
  '</details>';
}
function userRowHtml(b){
  const stage=STAGE_META[b.stage]||STAGE_META.unclassified;
  return '<tr>'+
    '<td>'+esc(b.category)+'</td>'+
    '<td><span class="stage-badge" style="color:'+stage.color+';border-color:'+stage.color+'">'+stage.short+'</span></td>'+
    '<td class="num">'+fmtInt(b.count)+'</td><td class="num">'+fmtInt(b.articleCount)+'</td><td class="num">'+fmtInt(b.journalCount)+'</td>'+
  '</tr>';
}

// Small inline trend line — lives inside the North Star card, not a separate section.
// "Is it moving" is the same question as "what's the number," not a different one.
function renderNsSparkline(){
  const canvas=document.getElementById('nsSparkline');
  if(!canvas) return;
  if(trendChart){trendChart.destroy();trendChart=null;}
  if(runsIndex.length<2) return; // nothing to compare yet — leave it empty rather than draw a flat meaningless line
  const runs=runsIndex.slice().reverse();
  const series=runs.map(function(r){
    let must=0;
    (r.categoryBreakdown||[]).forEach(function(c){
      const stage=XML_STAGES[c.category]||'unclassified';
      if(STAGE_COUNTS_AGAINST_GOAL[stage]) must+=c.count;
    });
    return must;
  });
  trendChart=new Chart(canvas,{
    type:'line',
    data:{labels:runs.map(function(){return '';}),
      datasets:[{data:series,borderColor:'#A6402B',backgroundColor:'transparent',tension:.25,pointRadius:0,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{x:{display:false},y:{display:false}}}
  });
}

function renderDeepDive(summary){
  const el=document.getElementById('deepDiveSection');
  const stuck=summary.stuckArticles.slice(0,15);
  const messy=summary.messiest.slice(0,15);
  const worstJournals=summary.journals.slice().sort(function(a,b){return b.errorsPerArticle-a.errorsPerArticle;}).filter(function(j){return j.articleCount>=3;}).slice(0,10);

  function catRows(){return summary.categories.map(function(c){return '<tr><td class="mono" style="max-width:340px;">'+esc(c.template)+'</td><td>'+esc(c.category)+'</td><td class="num">'+fmtInt(c.count)+'</td><td class="num">'+fmtInt(c.articleCount)+'</td><td class="num">'+fmtInt(c.journalCount)+'</td></tr>';}).join('');}
  function stuckRows(){return stuck.map(function(a){return '<tr><td class="mono">'+esc(a.aid)+'</td><td class="mono">'+esc(a.jid)+'</td><td class="num">'+fmtInt(a.runs)+'</td><td class="num">'+a.distinctErrorTypes+'</td><td>'+esc(a.firstSeen)+'</td><td>'+esc(a.lastSeen)+'</td></tr>';}).join('');}
  function messyRows(){return messy.map(function(a){return '<tr><td class="mono">'+esc(a.aid)+'</td><td class="mono">'+esc(a.jid)+'</td><td class="num">'+a.distinctErrorTypes+'</td><td class="num">'+fmtInt(a.runs)+'</td></tr>';}).join('');}
  function journalRows(){return worstJournals.map(function(j){return '<tr><td class="mono">'+esc(j.jid)+'</td><td class="num">'+j.errorsPerArticle.toFixed(1)+'</td><td class="num">'+fmtInt(j.errorCount)+'</td><td class="num">'+fmtInt(j.articleCount)+'</td></tr>';}).join('');}

  el.innerHTML=
    '<div class="section-label">Everything else</div>'+
    '<details><summary>Stuck articles — most re-validation attempts</summary>'+
      '<div class="details-body"><table class="data"><thead><tr><th class="mono">Article</th><th class="mono">Journal</th><th class="num">Runs</th><th class="num">Distinct errors</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>'+stuckRows()+'</tbody></table></div>'+
    '</details>'+
    '<details><summary>Journals with highest errors-per-article rate</summary>'+
      '<div class="details-body"><p class="footnote">Limited to journals with ≥3 articles in this dataset.</p><table class="data"><thead><tr><th class="mono">Journal</th><th class="num">Errors/article</th><th class="num">Total errors</th><th class="num">Articles</th></tr></thead><tbody>'+journalRows()+'</tbody></table></div>'+
    '</details>'+
    '<details><summary>Messiest articles — most distinct error types at once</summary>'+
      '<div class="details-body"><table class="data"><thead><tr><th class="mono">Article</th><th class="mono">Journal</th><th class="num">Distinct errors</th><th class="num">Runs</th></tr></thead><tbody>'+messyRows()+'</tbody></table></div>'+
    '</details>'+
    '<details><summary>Every distinct error message ('+summary.categories.length+')</summary>'+
      '<div class="details-body"><table class="data"><thead><tr><th>Message pattern</th><th>Category</th><th class="num">Instances</th><th class="num">Articles</th><th class="num">Journals</th></tr></thead><tbody>'+catRows()+'</tbody></table></div>'+
    '</details>';
}

function renderAll(summary){
  document.getElementById('emptyState').hidden=true;
  document.getElementById('main').hidden=false;
  renderNorthStar(summary);
  renderAsk(summary);
  renderPriority(summary);
  renderDeepDive(summary);
}

(async function boot(){
  try{
    await loadIndex();
    if(runsIndex.length){
      const latest=runsIndex[0];
      const summary=await loadRun(latest.id);
      if(summary){
        currentSummary=summary;
        currentRunId=latest.id;
        populateRunSelect(latest.id);
        renderAll(summary);
      }
    }
  }catch(e){ console.error('Boot error',e); }
})();
</script>
